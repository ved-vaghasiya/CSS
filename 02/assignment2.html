<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .navbar {
            height: 74px;
            width: 100%;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 55px;
            border-bottom: 1px solid #eeeeee;
            font-family: Arial, sans-serif;
        }

        .left-menu {
            display: flex;
            gap: 50px;
            align-items: center;
        }

        .left-menu a,
        .right-menu a {
            text-decoration: none;
            color: #555;
            font-size: 15px;
        }

        .logo {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo svg {
            width: 42px;
            height: 42px;
        }

       
        .right-menu {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .search {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search svg {
            width: 22px;
            height: 22px;
        }

        .profile {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #f5c400;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .profile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <!-- Left Menu -->
        <div class="left-menu">
            <a href="#">Home</a>
            <a href="#">Collection</a>
            <a href="#">Cart</a>
            <a href="#">Contact</a>
        </div>


        <div class="logo">

        </div>


        <!-- Right Menu -->
        <div class="right-menu">

            <a href="#">Shops</a>
            <a href="#">Account</a>

            <!-- Search Icon -->
            <div class="search">

                <svg width="64px" height="64px"
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg">

                    <path

            </div>


            <!-- Profile -->
            <div class="profile">

            </div>

        </div>

    </nav>
